<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <form action="">

       <label for="">first name:</label>
       <input type="text">

       <br>

       <label for=""> second name: </label>
       <input type="text">
       <br>

       <label for="">Age</label>
       <input type="number">

       <br><br>
       <label for="">date of birth</label>
       <input type="date">
       <br>

       <label for="">password</label>
       <input type="password">
       <br>
       <label for="email">email</label>
       <input id="email" type="email">

       <p>Enter your Tshirt Size</p>

       
       <input id="small"  name="Tshirt Size"   type="radio" value="small">
       <label for="small">small</label> <br>
       
       <input id="medium"  name="Tshirt Size"    type="radio" value="medium">
        <label  for="medium">medium</label> <br>
        
       <input id="large"  name="Tshirt"  type="radio" value="large">
       <label for="large">large</label>
       <br>

       <label for="color">your favourite color</label>
       <input id="color" type="color">
       <br>

       <label for="cars">choose your car</label>
       <select name="car" id="cars">
        <option value="volvo">volvo</option>
        <option value="audi">audi</option>
        <option value="saab">saab</option>
        <option value="fiat">fiat</option>
       </select>
       <br><br> 

       <label for="about yourself">about yourself:</label>
       <br>
       <textarea name="about yourself" id="about yourself" rows="20" cols="30"></textarea>
       <br><br>

       <fieldset>
        <legend>Do you agree to the terms and conditions:</legend>
        <label for="Yes">Yes</label>
        <input id="Yes" type="radio">
        <label for="No">No</label>
        <input id="No" type="radio">
       </fieldset>

       <input type="reset">
       <input type="submit">



         
    </form>
    
</body>
</html>
