<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form </title>
</head>
<body>

    <form>

        <fieldset>
            <legend>personal information</legend>

           <label for="fullname"> fullname:</label>
           <input type="text" id="fullname" name="fullname" placeholder="Enter your fullname" required>

           <br>

            <label for="email">Email:</label>
           <input type="email" id="email"  name="email"  placeholder="Enter your email" required>

           <br>

             <label for="password">password:</label>
           <input type="password" id="password"  name="password"     placeholder="Enter your password" required>

           <br>

            <label for="dob">date of Birth:</label>
           <input type="date" id="dob"  name="dob"     placeholder="Enter your dob" required>

           <br>

           <p>select your gender</p>
           <input type="radio" id="male" name="gender" value="Male" >
           <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" >
           <label for="female">female</label>

           <br>

           <label for="course">course:</label>
           <select name="course" id="course" required>
             <option value="">select your course </option>
             <option value="cse">computer science engineering </option>
             <option value="Ai">Artificial intelligence</option>
             <option value="ese">Electronics</option>
           </select>

           <br>

           <p>Select your hobbies:</p>
           <input type="checkbox" id="cricket" name="hobbies" value="cricket">
           <label for="cricket">cricket</label>
           <input type="checkbox" id="badmittion" name="hobbies" value="badmittion">
           <label for="badmittion">badmittion</label>
           <input type="checkbox" id="kabaddi" name="hobbies" value="kabaddi">
           <label for="kabaddi">kabaddi</label>

           <br>

           <label for="address">Address:</label>
           <br>
           <textarea name="address" id="address" rows="5" cols="30" placeholder="Enter your address"></textarea>

           <br>

           <button type="submit">submit</button>
           <button type="reset">Reset</button>






        </fieldset>



    </form>
    
</body>
</html>
